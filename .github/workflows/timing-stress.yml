name: Timing Stress

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: timing-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  timing-stress:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        load: [normal, cpu-load]
        config: [Release, Debug]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build azclips.slnx --configuration ${{ matrix.config }}

      - name: Start CPU load
        if: matrix.load == 'cpu-load'
        run: |
          cores=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo "$NUMBER_OF_PROCESSORS")
          for i in $(seq 1 "$cores"); do (while :; do :; done) & done
          echo "Started $cores busy loops"

      - name: Run unit tests like ADO until the time budget ends
        run: |
          failures=0
          end=$(( $(date +%s) + 300*60 ))
          i=0
          while [ "$(date +%s)" -lt "$end" ]; do
            i=$((i+1))
            echo "::group::Iteration $i"
            dotnet test azclips.slnx -c ${{ matrix.config }} --no-build --no-restore --filter "FullyQualifiedName!~Scenario.Tests&Category!=LocalOnly" --logger "console;verbosity=minimal" || { failures=$((failures+1)); echo "::error::Unit tests failed in iteration $i"; }
            echo "::endgroup::"
          done
          echo "Iterations: $i"
          echo "Failed runs: $failures"
          test "$failures" -eq 0
